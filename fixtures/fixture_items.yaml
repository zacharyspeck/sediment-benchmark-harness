# =====================================================================
# FIXTURES -- 30 hand-written items with known answers
#
# WHAT THIS FILE IS FOR
# ---------------------
# Every grader must be provable. Each item below carries a question, a gold
# answer, and TWO hand-written responses -- one per fixture arm -- plus an
# `expect` block stating exactly what the grader must return for each. The
# test suite (tests/test_fixtures.py) asserts that, so a grader that silently
# changes behaviour fails a test rather than quietly changing a benchmark
# result.
#
# It is also a two-arm end-to-end run: `fixture_strong` is a mostly-correct
# system, `fixture_weak` a worse one. Running them produces a real report with
# real confidence intervals, which is what makes the sample report meaningful
# rather than decorative.
#
# GOLD VALUES ARE COMPUTED, NOT GUESSED
# -------------------------------------
# Every numeric gold below was computed from fixtures/mini_ledger.json through
# the harness's own query layer, not worked out by hand. tests/test_fixtures.py
# recomputes them and fails if the ledger and the fixtures drift apart.
#
# FAILURE MODES COVERED (the point of the exercise)
# -------------------------------------------------
#   correct                 many
#   wrong                   many
#   malformed / no ANSWER   sfr-fix-02.weak, mda-fix-03.weak (empty label),
#                           cws-fix-02.weak, ira-fix-05.weak
#   fabricated entities     sfr-fix-04.weak, mda-fix-05.weak, aaa-fix-05.weak
#   correct but verbose     sfr-fix-02.strong, cws-fix-01.strong, ira-fix-01.strong
#   refusals                sfr-fix-05.weak, ira-fix-04.weak, aaa-fix-04.weak
#   unit slips (still right) mda-fix-04.strong (fraction), cws-fix-01.strong (months)
#
# NOTE ON sfr-fix-04.weak: it is CORRECT and it FABRICATES. That combination is
# deliberate -- it proves the fabrication scorer is independent of correctness,
# which is the whole reason it is a separate number.
# =====================================================================

version: 1
ledger: fixtures/mini_ledger.json

items:

# =====================================================================
# FAMILY 1 -- single_fact_recall
# =====================================================================

  - item_id: sfr-fix-01
    family: single_fact_recall
    question: "What multiple did Westbrook pay for Project Kilnmouth?"
    answer_type: numeric
    gold:
      value: 6.4
      unit: multiple
    grading:
      tolerance: {abs: 0.05, rel: 0.0}
    meta: {difficulty: easy, source_deal: Kilnmouth, fixture_case: "correct / wrong"}
    responses:
      fixture_strong: |
        ANSWER: 6.4x

        Kilnmouth was acquired in May 2017 at 6.4x adjusted EBITDA of $4.8M, an
        enterprise value of $30.7M. It became Fund I's proof case.
      fixture_weak: |
        ANSWER: 7.2x

        Westbrook paid around 7.2x for Kilnmouth.
    expect:
      fixture_strong: {score: 1.0, verdict: correct, fabricated: false}
      fixture_weak: {score: 0.0, verdict: incorrect, fabricated: false}

  - item_id: sfr-fix-02
    family: single_fact_recall
    question: "What share of revenue did Project Craygarth's largest customer represent?"
    answer_type: numeric
    gold:
      value: 82
      unit: percent
    grading:
      tolerance: {abs: 0.5, rel: 0.0}
    meta: {difficulty: easy, source_deal: Craygarth, fixture_case: "verbose-correct / malformed"}
    responses:
      fixture_strong: |
        ANSWER: 82%

        Project Craygarth was an education communications provider that Westbrook
        screened in March 2022. The business itself looked good on the surface:
        $28.0M of revenue, $6.2M of adjusted EBITDA, a 22.1% margin, founder
        owned, no debt, and growth above 30% in each of the prior three years.

        The problem was the customer base. A single school-district purchasing
        co-op represented 82% of revenue under an annually renewed agreement.
        Management presented that as a fifteen-year partnership. Westbrook read
        it as one procurement decision away from a broken company, and passed
        pre-LOI on criterion one.
      fixture_weak: |
        Craygarth's largest customer was a school-district purchasing co-op, and
        it accounted for 82% of revenue. That was the reason for the pass.
    expect:
      fixture_strong: {score: 1.0, verdict: correct, fabricated: false}
      fixture_weak:
        score: 1.0
        verdict: correct
        extraction_uncertain: true
        flags_include: [missing_answer_line, extraction_uncertain]

