  - item_id: ira-fix-01
    family: implicit_rule_application
    question: |
      A new opportunity has come in. Nothing about it appears in any file.

        Sector:                        vertical SaaS
        US headquartered:              true
        Revenue:                       $57.1M
        Adjusted EBITDA:               $17.0M
        Adjusted EBITDA margin:        29.7%
        Top customer:                  11% of revenue
        Top three customers:           39% of revenue
        Gross logo retention:          88.8%
        Funded debt at close:          false
        Recurring revenue:             54%
        Revenue growth:                20.8%
        Owner age:                     71
        Seller rollover:               20%

      Does Westbrook advance this or pass? Answer with one word.
    answer_type: categorical
    gold:
      value: pass
      unit: none
    meta:
      difficulty: hard
      holdout_id: holdout-mini-000
      bucket: discriminating
      discriminates: true
      written_criteria_verdict: advance
      written_criteria_failures: []
      driving_rule_ids: [RULE-F2]
      fixture_case: "correct-with-rule-citation / answered-the-written-criteria"
    responses:
      fixture_strong: |
        ANSWER: pass

        Every written screen is clear. Top customer is 11%, well inside the 30%
        ceiling. Margin is 29.7%, comfortably above 20%. No funded debt, US
        headquartered, revenue and EBITDA both inside the mandate. On the
        published criteria this advances.

        It still passes. Gross logo retention is 88.8%, and the retention floor
        is the thing that actually decides this one. What this file does in
        practice sits materially tighter than the published screen, and this
        number is on the wrong side of it. Double-digit churn is a no regardless
        of how the rest of the page looks, and 11.2% churn on a business with
        only 54% recurring revenue is not something that gets underwritten
        here.
      fixture_weak: |
        ANSWER: advance

        This clears every criterion. Top customer at 11% is well under the 30%
        limit, the margin is 29.7% against a 20% floor, there is no funded debt
        and the company is US headquartered. Revenue and EBITDA are both inside
        the mandate range. It should go forward.
    expect:
      fixture_strong:
        score: 1.0
        verdict: correct
        fabricated: false
        rule_cited: true
      fixture_weak:
        score: 0.0
        verdict: incorrect
        flags_include: [answered_the_written_criteria]

